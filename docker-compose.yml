services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker_ai
    ports:
      - "5432:5432"
    volumes:
      - broker_ai_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  broker_ai_data:
